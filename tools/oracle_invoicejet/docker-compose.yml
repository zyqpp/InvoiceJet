services:
  oracle-invoicejet:
    build:
      context: .
    container_name: oracle-invoicejet
    ports:
      - "8502:8502"
    environment:
      ORACLE_MODEL_PRESET: rtx2060
      ORACLE_REPO_ROOT: /workspace
      ORACLE_CHROMA_PATH: /data/chroma_data
      ORACLE_MANIFEST_PATH: /data/index_manifest.json
      ORACLE_COLLECTION_NAME: oracle_invoicejet_docs
      ORACLE_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORACLE_LLM_MODEL: gemma3:4b
      ORACLE_EMBEDDING_MODEL: bge-m3
      ORACLE_TOP_K: "5"
      ORACLE_NUM_CTX: "8192"
      ORACLE_TEMPERATURE: "0.1"
      ORACLE_NUM_PREDICT: "512"
      ORACLE_CHUNK_SIZE: "1800"
      ORACLE_CHUNK_OVERLAP: "250"
      ORACLE_BATCH_SIZE: "24"
      ORACLE_MIN_HITS: "1"
      ORACLE_ALLOWED_MODELS: gemma3:4b,gemma3:1b,qwen3:4b,qwen3:1.7b,bge-m3,nomic-embed-text
      ORACLE_EXCLUDE_DIRS: .git,node_modules,bin,obj,.venv,venv,chroma_data,.tmp,archiwum,docs,InvoiceJetAPI,InvoiceJetUI,wytyczne,_site,models,__pycache__
    volumes:
      - ../..:/workspace:ro
      - ./docker-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
