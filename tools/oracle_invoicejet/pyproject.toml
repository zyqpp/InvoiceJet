[project]
name = "oracle-invoicejet"
version = "0.1.0"
description = "Local Oracle InvoiceJet RAG assistant over InvoiceJet documentation."
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5,<2",
  "requests>=2.32",
  "streamlit>=1.49",
]

[project.scripts]
oracle-doctor = "oracle_invoicejet.cli:doctor_main"
oracle-ingest = "oracle_invoicejet.cli:ingest_main"
oracle-query = "oracle_invoicejet.cli:query_main"
oracle-evaluate = "oracle_invoicejet.cli:evaluate_main"
oracle-serve = "oracle_invoicejet.cli:serve_main"
oracle-pull-models = "oracle_invoicejet.cli:pull_recommended_main"

[tool.setuptools.packages.find]
include = ["oracle_invoicejet*"]
exclude = ["chroma_data*", "scripts*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
