{% extends "base.html" %}

{% block styles %}
{{ super() }}
<style>
.md-tabs { display: none !important; }
.ij-cat-bar { background: #3f51b5; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; align-items: center; }
.ij-cat-btn { color: rgba(255,255,255,.85); text-decoration: none; padding: 6px 10px; border-radius: 4px; font-size: .78rem; font-weight: 500; border: 1px solid transparent; transition: all .15s; }
.ij-cat-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.ij-cat-btn.active { background: rgba(255,255,255,.18); color: #fff; border-color: #fff; }
.ij-portal-switch { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.ij-portal-btn { color: rgba(255,255,255,.75); text-decoration: none; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); font-size: .72rem; }
.ij-portal-btn:hover { border-color: #fff; color: #fff; }
.ij-portal-btn.current { background: rgba(255,255,255,.2); color: #fff; border-color: rgba(255,255,255,.6); }
.md-content { max-width: 920px; }
.md-nav__link--active { color: #3f51b5 !important; font-weight: 600; }
.md-typeset table:not([class]) { font-size: .78rem; }
.md-typeset table th { background: #eef2ff; font-weight: 700; }
.md-typeset table tr:hover { background: #f8fafc; }
.md-typeset code { background: #f1f5f9 !important; color: #0f172a !important; border-radius: 4px; padding: 1px 5px; }
</style>
{% endblock %}

{% block tabs %}
<div class="ij-cat-bar" role="navigation" aria-label="Sekcje dokumentacji">
  <a href="/" class="ij-cat-btn" data-cat="">Strona glowna</a>
  <a href="/01_ekrany/index.html" class="ij-cat-btn" data-cat="01_ekrany">Opisy ekranow</a>
  <a href="/02_procesy/index.html" class="ij-cat-btn" data-cat="02_procesy">Instrukcje procesow</a>
  <a href="/zrodla.html" class="ij-cat-btn" data-cat="zrodla">Zrodla</a>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function() {
  var DOC_AI_URL = "{{ config.extra.portal.doc_ai_url }}";
  var DOC_USER_URL = "{{ config.extra.portal.doc_user_url }}";
  var DOCS_DIR = "{{ config.extra.source_dir }}";
  var EDITOR_URL = "{{ config.extra.editor_url }}";

  function setActiveBtn() {
    var path = window.location.pathname;
    document.querySelectorAll(".ij-cat-btn[data-cat]").forEach(function(btn) {
      var cat = btn.getAttribute("data-cat");
      var active = cat === ""
        ? !["01_ekrany","02_procesy","zrodla"].some(function(c) { return path.indexOf("/" + c) !== -1; })
        : path.indexOf("/" + cat) !== -1;
      btn.classList.toggle("active", active);
    });
  }

  function addPortalSwitch() {
    if (document.getElementById("ij-portal-sw")) return;
    var sw = document.createElement("div");
    sw.id = "ij-portal-sw";
    sw.className = "ij-portal-switch";
    sw.innerHTML = '<a href="' + DOC_AI_URL + '" class="ij-portal-btn" title="Dokumentacja techniczna">Techniczna</a>'
      + '<a href="' + DOC_USER_URL + '" class="ij-portal-btn current" title="Dokumentacja uzytkownika">Uzytkownik</a>';
    var header = document.querySelector(".md-header__inner");
    if (header) header.appendChild(sw);
  }

  function sourcePathFromLocation() {
    var urlPath = decodeURIComponent(window.location.pathname).replace(/^\//, "").replace(/\.html$/, ".md");
    if (!urlPath) urlPath = "README.md";
    urlPath = urlPath.replace(/\/index\.md$/, "/README.md").replace(/^index\.md$/, "README.md");
    if (!urlPath || !DOCS_DIR || !EDITOR_URL) return "";
    return DOCS_DIR.replace(/[\\/]+$/, "") + "/" + urlPath;
  }

  function addEditButton() {
    if (document.getElementById("ij-edit-btn")) return;
    var filePath = sourcePathFromLocation();
    if (!filePath) return;
    var btn = document.createElement("a");
    btn.id = "ij-edit-btn";
    btn.href = EDITOR_URL.replace(/\/$/, "") + "/edit?path=" + encodeURIComponent(filePath);
    btn.target = "_blank";
    btn.rel = "noopener noreferrer";
    btn.title = "Edytuj ten plik w webowym edytorze";
    btn.textContent = "Edytuj";
    btn.style.cssText = "margin-left:6px;font-size:.78rem;opacity:.86;text-decoration:none;transition:opacity .15s;cursor:pointer;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:3px 8px;color:inherit;";
    btn.onmouseover = function() { this.style.opacity = "1"; };
    btn.onmouseout = function() { this.style.opacity = ".86"; };
    var header = document.querySelector(".md-header__inner");
    if (header) header.appendChild(btn);
  }

  function refreshHeaderTools() {
    setActiveBtn();
    addPortalSwitch();
    var old = document.getElementById("ij-edit-btn");
    if (old) old.remove();
    addEditButton();
  }

  document.addEventListener("DOMContentLoaded", refreshHeaderTools);
  if (typeof document$ !== "undefined") {
    document$.subscribe(refreshHeaderTools);
  }
})();
</script>
{% endblock %}
